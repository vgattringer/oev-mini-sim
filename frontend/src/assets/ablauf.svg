<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img">
<title>Gesamtablauf der ÖV-Mini-Simulation</title>
<desc>Der Publisher fragt die Wiener Linien per HTTP ab und sendet die Daten über MQTT an Mosquitto. Das Backend abonniert sie, speichert sie in PostgreSQL und schickt sie per WebSocket an das Frontend. Beim Verbinden liest das Backend den letzten Stand aus PostgreSQL.</desc>
<style>
text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 12px; fill: #444441; }
.titel-gruen { font-size: 14px; font-weight: 500; fill: #085041; }
.unter-gruen { fill: #0F6E56; }
.titel-grau { font-size: 14px; font-weight: 500; fill: #444441; }
.unter-grau { fill: #5F5E5A; }
.kasten-gruen { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1; }
.kasten-grau { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 1; }
.pfeil { fill: none; stroke: #444441; stroke-width: 1.5; }
</style>
<defs>
<marker id="pfeilspitze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0.5" y="0.5" width="679" height="399" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>

<rect class="kasten-grau" x="40" y="40" width="124" height="60" rx="8"/>
<text class="titel-grau" x="102" y="62" text-anchor="middle" dominant-baseline="central">Wiener Linien</text>
<text class="unter-grau" x="102" y="82" text-anchor="middle" dominant-baseline="central">Echtzeitdaten</text>

<rect class="kasten-gruen" x="278" y="40" width="124" height="60" rx="8"/>
<text class="titel-gruen" x="340" y="62" text-anchor="middle" dominant-baseline="central">Publisher</text>
<text class="unter-gruen" x="340" y="82" text-anchor="middle" dominant-baseline="central">Node.js</text>

<rect class="kasten-gruen" x="516" y="40" width="124" height="60" rx="8"/>
<text class="titel-gruen" x="578" y="62" text-anchor="middle" dominant-baseline="central">Mosquitto</text>
<text class="unter-gruen" x="578" y="82" text-anchor="middle" dominant-baseline="central">MQTT-Broker</text>

<rect class="kasten-gruen" x="278" y="180" width="124" height="60" rx="8"/>
<text class="titel-gruen" x="340" y="202" text-anchor="middle" dominant-baseline="central">Backend</text>
<text class="unter-gruen" x="340" y="222" text-anchor="middle" dominant-baseline="central">Express + ws</text>

<rect class="kasten-gruen" x="516" y="180" width="124" height="60" rx="8"/>
<text class="titel-gruen" x="578" y="202" text-anchor="middle" dominant-baseline="central">Frontend</text>
<text class="unter-gruen" x="578" y="222" text-anchor="middle" dominant-baseline="central">React + Vite</text>

<rect class="kasten-gruen" x="278" y="320" width="124" height="60" rx="8"/>
<text class="titel-gruen" x="340" y="342" text-anchor="middle" dominant-baseline="central">PostgreSQL</text>
<text class="unter-gruen" x="340" y="362" text-anchor="middle" dominant-baseline="central">Datenbank</text>

<line class="pfeil" x1="274" y1="70" x2="168" y2="70" marker-end="url(#pfeilspitze)"/>
<text x="221" y="56" text-anchor="middle" dominant-baseline="central">HTTP-Abfrage</text>
<text x="221" y="86" text-anchor="middle" dominant-baseline="central">alle 20 s</text>

<line class="pfeil" x1="406" y1="70" x2="512" y2="70" marker-end="url(#pfeilspitze)"/>
<text x="459" y="56" text-anchor="middle" dominant-baseline="central">MQTT</text>
<text x="459" y="86" text-anchor="middle" dominant-baseline="central">publish</text>

<path class="pfeil" d="M578 104 L578 130 L340 130 L340 176" marker-end="url(#pfeilspitze)"/>
<text x="459" y="116" text-anchor="middle" dominant-baseline="central">MQTT-Abo, QoS 1</text>

<line class="pfeil" x1="406" y1="198" x2="512" y2="198" marker-end="url(#pfeilspitze)"/>
<text x="459" y="184" text-anchor="middle" dominant-baseline="central">WebSocket-Push</text>

<line class="pfeil" x1="512" y1="222" x2="406" y2="222" marker-end="url(#pfeilspitze)"/>
<text x="459" y="238" text-anchor="middle" dominant-baseline="central">Adresse mit</text>
<text x="459" y="254" text-anchor="middle" dominant-baseline="central">stopId</text>

<line class="pfeil" x1="316" y1="244" x2="316" y2="316" marker-end="url(#pfeilspitze)"/>
<text x="306" y="274" text-anchor="end" dominant-baseline="central">speichern</text>
<text x="306" y="290" text-anchor="end" dominant-baseline="central">(Upsert)</text>

<line class="pfeil" x1="364" y1="316" x2="364" y2="244" marker-end="url(#pfeilspitze)"/>
<text x="374" y="274" text-anchor="start" dominant-baseline="central">lesen beim</text>
<text x="374" y="290" text-anchor="start" dominant-baseline="central">Verbinden</text>

<rect class="kasten-grau" x="40" y="332" width="12" height="12" rx="2"/>
<text x="60" y="338" dominant-baseline="central">Externe Quelle</text>
<rect class="kasten-gruen" x="40" y="354" width="12" height="12" rx="2"/>
<text x="60" y="360" dominant-baseline="central">Eigenes Projekt</text>
</svg>
