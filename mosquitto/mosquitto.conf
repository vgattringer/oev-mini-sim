# Persistenz: retained Nachrichten überleben einen Neustart des Brokers. 
persistence true
persistence_location /mosquitto/data/

# Logging in die Console aktivieren (sichtbar mit "docker compose logs")
log_dest stdout

# Zugriff nur mit Login und Passwort (siehe passwd)
allow_anonymous false
password_file /mosquitto/config/passwd

# Rechte pro Benutzer und Topic (siehe acl)
acl_file /mosquitto/config/acl

# Listener: klassisches MQTT auf Port 1883 (Publisher und Backend)
listener 1883
protocol mqtt
